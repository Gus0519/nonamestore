# 1. El disco duro temporal para el Pipeline (Workspace)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nonamestore-workspace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Tus credenciales de Docker Hub (Reemplaza TU_CONTRASEÑA en base64)
# Para obtener tu contraseña en base64 ejecuta en terminal: echo -n "tu-password" | base64
apiVersion: v1
kind: Secret
metadata:
  name: docker-credentials
  annotations:
    tekton.dev/docker-0: https://index.docker.io/v1/
    # Y agregamos la genérica por si acaso
    tekton.dev/docker-1: index.docker.io
type: kubernetes.io/basic-auth
stringData:
  username: gusgus890
  password: <REEMPLAZAR_CON_DOCKERHUB_PAT>
---
# 3. La cuenta de servicio que usará Tekton
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build-bot
secrets:
  - name: docker-credentials
