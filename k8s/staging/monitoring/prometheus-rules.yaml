apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  rules.yml: |
    groups:
    - name: NoNameStoreAlerts
      rules:
      # 1. Alerta de CPU > 80%
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{pod=~".*nonamestore.*", container!=""}[2m])) by (pod) > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de CPU detectado en {{ $labels.pod }}"
          description: "El pod {{ $labels.pod }} ha superado el 80% de uso de CPU durante más de 1 minuto."

      # 2. Alerta de CrashLoopBackOff
      - alert: PodCrashLooping
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
        for: 1m
        labels:
          severity: crítica
        annotations:
          summary: "Pod caído (CrashLoopBackOff): {{ $labels.pod }}"
          description: "El pod {{ $labels.pod }} en el namespace {{ $labels.namespace }} está reiniciándose constantemente."
