apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack-notifications'

    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/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' # Cambiar por tu webhook real en Fase 4 si se requiere
        channel: '#alertas-nonamestore'
        send_resolved: true
