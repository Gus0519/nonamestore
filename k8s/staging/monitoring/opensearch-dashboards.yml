apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
      - name: opensearch-dashboards
        image: opensearchproject/opensearch-dashboards:2.11.0
        ports:
        - containerPort: 5601
        env:
        - name: OPENSEARCH_HOSTS
          value: '["http://opensearch-service:9200"]'
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: opensearch-dashboards
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30561
