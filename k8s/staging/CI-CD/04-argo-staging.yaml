apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nonamestore-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Gus0519/nonamestore.git' # Cambia esto
    targetRevision: HEAD
    path: k8s/staging # ArgoCD solo leerá los YAMLs dentro de esta carpeta
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging # Despliega todo en el namespace de pruebas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
